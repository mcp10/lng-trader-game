<style>
/* Layout: sticky ops bar; three-column trading floor (market board · chart and fleet · desk) that collapses to one column on phones */
:root{
  --bg:#0b151d; --bg2:#0e1c26; --panel:#122330; --panel2:#17303e; --line:#1f3747; --line2:#2d4b5e;
  --fg:#dde8ee; --fg2:#93a9b6; --fg3:#5f7786;
  --accent:#62d5e4; --accent-ink:#06171d; --accent-dim:#1e6b78; --accent-soft:rgba(98,213,228,.12);
  --amber:#e8aa3f; --amber-soft:rgba(232,170,63,.14); --good:#4fd08f; --good-soft:rgba(79,208,143,.14); --bad:#f07070; --bad-soft:rgba(240,112,112,.14);
  --sea:#0a1820; --land:#1a3442; --coast:#2b5062; --grat:#1a3140; --shadow:0 10px 30px rgba(0,0,0,.45);
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf2f5; --bg2:#e3ebf0; --panel:#ffffff; --panel2:#f2f6f9; --line:#d4dfe6; --line2:#b6c8d2;
    --fg:#152532; --fg2:#4b6472; --fg3:#7e94a1;
    --accent:#0f8d9e; --accent-ink:#ffffff; --accent-dim:#9fd9e2; --accent-soft:rgba(15,141,158,.10);
    --amber:#b5760e; --amber-soft:rgba(181,118,14,.12); --good:#1f9d61; --good-soft:rgba(31,157,97,.12); --bad:#cc4b4b; --bad-soft:rgba(204,75,75,.12);
    --sea:#d3e3ed; --land:#eaf0f3; --coast:#a9bfcb; --grat:#bfd2dd; --shadow:0 10px 30px rgba(21,37,50,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf2f5; --bg2:#e3ebf0; --panel:#ffffff; --panel2:#f2f6f9; --line:#d4dfe6; --line2:#b6c8d2;
  --fg:#152532; --fg2:#4b6472; --fg3:#7e94a1;
  --accent:#0f8d9e; --accent-ink:#ffffff; --accent-dim:#9fd9e2; --accent-soft:rgba(15,141,158,.10);
  --amber:#b5760e; --amber-soft:rgba(181,118,14,.12); --good:#1f9d61; --good-soft:rgba(31,157,97,.12); --bad:#cc4b4b; --bad-soft:rgba(204,75,75,.12);
  --sea:#d3e3ed; --land:#eaf0f3; --coast:#a9bfcb; --grat:#bfd2dd; --shadow:0 10px 30px rgba(21,37,50,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance}
button{font-family:inherit;font-size:inherit;color:inherit}
input{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.amber{color:var(--amber)}.dim{color:var(--fg2)}.dimmer{color:var(--fg3)}
.lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg3);font-weight:600}
.screen{min-height:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);border-radius:4px;padding:7px 12px;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,input:focus-visible,.card:focus-visible,.chip:focus-visible,.news-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:4px 8px;font-size:11px;letter-spacing:.06em}
.btn-lg{padding:12px 22px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg2);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-block:8px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand .t{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand .c{font-size:12px;color:var(--fg2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center;min-width:0}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;white-space:nowrap}
.stat .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--fg3);font-weight:600}
.topact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.struct{font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:14px;padding:2px 6px;border-radius:3px}
.struct.CONTANGO{background:var(--good-soft);color:var(--good)}
.struct.BACKWARDATION{background:var(--bad-soft);color:var(--bad)}
.struct.FLAT{background:var(--panel2);color:var(--fg2)}

/* floor */
.floor{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;padding-block:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.floor{grid-template-columns:300px minmax(0,1fr)}.col-desk{grid-column:1/-1}}
@media (max-width:820px){.floor{grid-template-columns:minmax(0,1fr)}.col-desk{grid-column:auto}.col-centre{order:-1}.topbar{position:static;grid-template-columns:1fr auto;row-gap:8px}.stats{grid-column:1/-1;gap:12px}.brand .c{max-width:160px}body::before{display:none}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h .hact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.panel-h h3{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--fg2)}
.panel-h .meta{font-size:11px;color:var(--fg3);font-family:var(--mono)}
.panel-b{padding:10px 12px}
.panel-b.tight{padding:0}

/* market board */
.hub{display:grid;grid-template-columns:1fr auto 80px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.hub:last-child{border-bottom:0}
.hub .n{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em}
.hub .venue{font-size:11px;color:var(--fg3)}
.hub .p{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;text-align:right;line-height:1}
.hub .chg{font-family:var(--mono);font-size:11px;text-align:right;display:block;margin-top:3px}
.spark{display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv .k{color:var(--fg2)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.curve{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px 8px;font-size:12px;align-items:baseline}
.curve .h{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--fg3);text-align:right}
.curve .r{font-family:var(--display);font-weight:600;font-size:13px}
.curve .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.curve.wk{grid-template-columns:auto repeat(3,1fr);gap:3px 8px}
.curve.wk .r{font-size:12.5px;white-space:nowrap}
.curve .wn{font-family:var(--mono);font-size:10px;color:var(--fg3);font-weight:400}
.curve.wk .v{font-size:12px}
.marker{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.marker:last-child{border-bottom:0}
.marker .n{font-family:var(--display);font-weight:600;font-size:14px}
.marker .s{font-size:11px;color:var(--fg3)}
.marker .p{font-family:var(--mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.marker .c{font-family:var(--mono);font-size:11px;text-align:right}
.flag{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;background:var(--amber-soft);color:var(--amber);margin-left:4px;vertical-align:middle}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.flag.good{background:var(--good-soft);color:var(--good)}
.flag.info{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;position:relative;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar b{position:absolute;top:-2px;width:2px;height:10px;background:var(--amber)}

/* chart */
.chart svg{width:100%;height:auto;display:block;background:var(--sea);border-radius:0 0 6px 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--fg3);padding:6px 12px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:4px}
.legend i.b{border-top-style:dashed;border-color:var(--fg3)}
.legend i.f{border-top-color:var(--amber)}
.legend em{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-right:4px;font-style:normal}
.legend em.d{background:var(--amber)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--fg3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl th.n{text-align:right}
.tbl .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.menu-wrap{display:inline-block}
.menu{position:fixed;z-index:25;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);min-width:180px;display:flex;flex-direction:column;padding:4px;gap:2px}
.menu .btn{justify-content:flex-start;border-color:transparent;background:transparent;text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:500;font-size:13px;padding:6px 10px}
.menu .btn:hover{background:var(--accent-soft);border-color:transparent}
.menu .btn-danger{color:var(--bad)}
.tbl .name{font-family:var(--display);font-weight:600;font-size:14px;white-space:nowrap}
.tbl .sub{font-size:11px;color:var(--fg3);display:block}
.tblwrap{overflow-x:auto}
.empty{padding:16px 12px;color:var(--fg3);font-size:13px;text-align:center}
.status{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--panel2);color:var(--fg2)}
.status.laden{background:var(--accent-soft);color:var(--accent)}
.status.ballast{background:var(--panel2);color:var(--fg2)}
.status.float{background:var(--amber-soft);color:var(--amber)}
.status.relet{background:var(--good-soft);color:var(--good)}
.status.idle{background:var(--panel2);color:var(--fg3)}
.status.waiting{background:var(--amber-soft);color:var(--amber)}
.status.term{background:var(--good-soft);color:var(--good)}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.wkgrid .chip-btn{text-align:center;padding:4px 2px}
.contract{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel2)}
.contract .t{font-family:var(--display);font-weight:700;font-size:14px}
.contract .terms{font-family:var(--mono);font-size:11.5px}
.contract p{margin:0;font-size:12px;color:var(--fg3)}
.contract .ob{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;border-top:1px solid var(--line);padding-top:4px;flex-wrap:wrap}
.contracts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.status.spot{background:var(--panel2);color:var(--fg2)}

/* desk */
.next{width:100%;font-size:18px;padding:14px}
.news-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:10px 1fr;gap:8px}
.news-item:last-child{border-bottom:0}
.news-item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.news-item.read .dot{background:transparent;border:1px solid var(--line2)}
.news-item h4{font-size:14px;font-weight:600;line-height:1.2}
.news-item.read h4{color:var(--fg2);font-weight:500}
.news-item p{margin:3px 0 0;font-size:12.5px;color:var(--fg2)}
.news-item.read p{display:none}
.news-item .when{font-family:var(--mono);font-size:10.5px;color:var(--fg3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:transparent;background:var(--good-soft)}
.chip.down{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
.chip.story{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.analyst{display:grid;grid-template-columns:34px 1fr;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-dim);color:var(--fg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px}
.analyst .who{font-family:var(--display);font-weight:600;font-size:14px}
.analyst .role{font-size:11px;color:var(--fg3)}
.analyst p{margin:6px 0 0;font-size:13px}
.nb{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.nb td,.nb th{padding:4px 6px;border-bottom:1px solid var(--line)}
.nb th{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--fg3);text-align:left;font-weight:600}
.nb td.n,.nb th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.nb tr:last-child td{border-bottom:0}
.odds{display:grid;gap:5px;margin-top:8px}
.odds .o{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;font-size:12px}
.odds .o .bar{margin:4px 0 0}
.odds .o .pct{font-family:var(--mono);text-align:right}
.fin{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.fin .k{color:var(--fg2)}.fin .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.fin .total{border-top:1px solid var(--line2);padding-top:5px;margin-top:3px;font-weight:600}
.fin .total.k{color:var(--fg)}
.log{list-style:none;margin:0;padding:0;font-size:12px}
.log li{padding:6px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr;gap:8px}
.log li:last-child{border-bottom:0}
.log .w{font-family:var(--mono);color:var(--fg3)}
.log .buy{border-left:3px solid var(--accent)}.log .sell{border-left:3px solid var(--good)}.log .risk{border-left:3px solid var(--amber)}.log .fleet{border-left:3px solid var(--line2)}.log .sys{border-left:3px solid transparent}
.levelbox{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.levelbox div{font-family:var(--mono);font-size:10.5px;text-align:center;padding:4px 2px;border:1px solid var(--line);border-radius:3px;color:var(--fg3)}
.levelbox div.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,12,18,.72);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:8px;width:100%;max-width:820px;box-shadow:var(--shadow);margin-top:env(safe-area-inset-top,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:20px;text-transform:uppercase;letter-spacing:.08em}
.sheet-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}@media (max-width:600px){.sheet-f>span{flex-basis:100%}}
.sheet-f .err{margin-right:auto;color:var(--bad);font-size:13px;align-self:center}
.close{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--fg2);padding:4px 8px}
.close:hover{color:var(--accent)}
.step{display:flex;flex-direction:column;gap:8px}
.step .lbl b{color:var(--accent);margin-right:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.card{border:1px solid var(--line2);border-radius:6px;padding:9px 10px;background:var(--panel2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.card.off{opacity:.5;cursor:not-allowed}
.card .t{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1}
.card .s{font-size:11px;color:var(--fg3)}
.card .p{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.card .m{font-family:var(--mono);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.chip-btn.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip-btn:disabled{opacity:.4;cursor:not-allowed}
.econ{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.econ .k{color:var(--fg2);min-width:0}.econ .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;max-width:45vw;overflow:hidden;text-overflow:ellipsis}
.econ .h{grid-column:1/-1;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--fg3);margin-top:4px}
.econ .tot{border-top:1px solid var(--line2);padding-top:4px;font-weight:600}
.econ .tot.k{color:var(--fg)}
.note{font-size:12.5px;color:var(--fg2);background:var(--panel2);border-left:3px solid var(--amber);padding:8px 10px;border-radius:0 4px 4px 0}
.guide h3{font-size:16px;margin-top:6px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.guide p{margin:4px 0 0;font-size:13.5px;max-width:65ch}
.guide ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;max-width:65ch}
.guide li{margin:2px 0}
input.text{width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);border-radius:4px;font-size:16px;font-family:var(--display);letter-spacing:.04em}

/* home & end */
.home{max-width:980px;margin:0 auto;padding-block:40px 60px;display:flex;flex-direction:column;gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.hero h1 span{color:var(--accent)}
.hero .tag{font-size:16px;color:var(--fg2);max-width:46ch;margin-top:10px}
.hero .meta{margin-top:10px}
.start{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.start .row{display:flex;gap:8px;flex-wrap:wrap}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.feat .f{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.feat .f h3{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:4px}
.feat .f p{margin:0;font-size:13px;color:var(--fg2)}
.foot{font-size:12px;color:var(--fg3)}.foot a{color:var(--fg2);text-decoration:underline;text-underline-offset:2px}.foot a:hover{color:var(--accent)}.phone-note{display:none}@media (max-width:600px){.phone-note{display:inline}}
.end{max-width:760px;margin:0 auto;padding-block:50px;text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center}
.end .big{font-family:var(--mono);font-size:clamp(40px,8vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.end .stars{font-size:40px;letter-spacing:.1em;color:var(--amber)}
.end .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.end .grid div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.end .grid .v{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:4px;z-index:30;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
.vessel-float{animation:none}
</style>
